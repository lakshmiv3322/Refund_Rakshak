version: "3.8"

services:
  refundrakshak:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - NODE_ENV=production
      - DATA_DIR=/app/data
      - RULES_PATH=/app/data/verified_rules.json
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-3.8-flash}
      - GEMINI_FALLBACK_MODEL=${GEMINI_FALLBACK_MODEL:-gemini-3.8-flash}
      - ENABLE_SIM_TIME=${ENABLE_SIM_TIME:-false}
      - B2B_API_KEY=${B2B_API_KEY:-}
      - DEV_OPEN_ACCESS=${DEV_OPEN_ACCESS:-false}
    volumes:
      - refundrakshak_data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  refundrakshak_data:

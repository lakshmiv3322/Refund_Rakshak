# aiKart Agent Manifest for RefundRakshak
# Standard aiKart v1alpha1 specification

apiVersion: aikart.ai/v1alpha1
kind: Agent
metadata:
  name: RefundRakshak
  version: "1.0.0"
  category: "Fintech Grievance & Legal-Tech Agent"
  description: "Production-grade multilingual AI agent that processes Indian UPI and payment grievances, applies verified RBI TAT rules, prepares deterministic escalations, and automates grievance redressal with explicit human authorization."
spec:
  endpoint: "/api/agent/run"
  healthEndpoint: "/api/health"
  supportedInput:
    - "text/plain"
    - "application/json"
    - "image/png"
    - "image/jpeg"
  supportedOutput:
    - "application/json"
    - "text/event-stream"
  languages:
    - "en"
    - "hi"
    - "ta"
    - "te"
    - "mr"
  tools:
    - name: get_case_state
      description: "Retrieves current grievance case facts, timeline, and pending actions."
    - name: update_case_facts
      description: "Updates and validates transaction facts (amount, date, reference, bank, status) with strict validation."
    - name: extract_transaction_evidence
      description: "Extracts structured transaction evidence from payment screenshots or text using Gemini vision with structured schema."
    - name: record_classification
      description: "Records grievance classification (supported UPI failure, unauthorized fraud, merchant refund, ATM dispute) with rationale."
    - name: lookup_verified_rule
      description: "Looks up verified statutory rules from RBI circulars (RBI/2019-20/67)."
    - name: calculate_deadline_and_estimate
      description: "Calculates deterministic TAT reversal deadline and statutory delayed-compensation estimate based on scenario table."
    - name: validate_ombudsman_preconditions
      description: "Validates preconditions under the RBI Integrated Ombudsman Scheme (30-day waiting period from initial bank complaint)."
    - name: verify_bank_contact
      description: "Verifies official bank grievance and Principal Nodal Officer contact details using Google Search grounding."
    - name: generate_bank_complaint
      description: "Generates a structured bank grievance redressal complaint draft citing relevant circulars."
    - name: generate_nodal_escalation
      description: "Generates an escalation notice to Principal Nodal Officer for unresolved disputes."
    - name: generate_ombudsman_draft
      description: "Generates an official RBI Ombudsman complaint package for submission on cms.rbi.org.in."
    - name: generate_evidence_pack
      description: "Generates a comprehensive PDF evidence pack with masked reference numbers and legal disclaimers."
    - name: draft_email
      description: "Creates a pending action for bank or nodal officer communication requiring explicit human approval."
    - name: schedule_followup
      description: "Schedules automated follow-up checks against statutory SLA timelines."
    - name: ask_user
      description: "Prompts the user for specific missing transaction details and pauses agent execution."
    - name: stop_branch
      description: "Terminates standard grievance path for safety branch (cybercrime fraud) or out-of-scope disputes."
  examples:
    - title: "Failed UPI debit grievance resolution"
      description: "User submits an unresolved UPI failed transaction with debit. Agent verifies evidence, applies RBI TAT (T+1 calendar day), calculates statutory compensation, and proposes a bank complaint draft for approval."
      request:
        path: "/api/agent/run"
        method: "POST"
        headers:
          Content-Type: "application/json"
          Authorization: "Bearer <case_token>"
        body:
          case_id: "RR-DEMO-001"
          message: "My UPI payment of Rs 2400 to grocery store failed on 22 Sept, but money was debited from my SBI account. UTR is DEMOUPI123456."
          language: "en"
      response:
        status: 200
        body:
          case_id: "RR-DEMO-001"
          message: "I have recorded your grievance for the failed UPI transaction of ₹2,400 on 2026-09-22 with State Bank of India (Ref: ****3456). Under RBI Circular RBI/2019-20/67 (Item 4(a)), reversal TAT is T+1 calendar day. Since 9 days have elapsed, the potential compensation estimate is ₹800 (subject to verification). I have prepared an initial complaint draft to State Bank of India for your review and explicit approval."
          language: "en"
          status: "approval_required"
          approval_request:
            id: "act_bk_01"
            type: "bank_complaint"
            payload:
              recipient: "customercare@sbi.co.in"
              bank_name: "State Bank of India"
              subject: "Grievance Redressal: UPI Failed & Debited (Ref: ****3456)"
          case_state:
            case_id: "RR-DEMO-001"
            classification: "supported_upi_failed_debited_not_credited"
            branch: "supported_upi_failed_debit"
            latest_compensation_estimate: 800
            latest_days_delayed: 8
  safetyNotes:
    - "Does not offer legal advice or guarantee financial recovery."
    - "Requires explicit human authorization prior to sending any outbound communication."
    - "Automatically redacts UPI PINs, OTPs, CVVs, passwords, and Aadhaar numbers from all storage and telemetry."
    - "Masks transaction reference numbers to last 4 digits in external exports and logs."
    - "Refers unauthorized and fraudulent transactions to the National Cyber Crime Reporting Portal (cybercrime.gov.in / 1930)."
  maintainer: "RefundRakshak Team (BharatAgentic Hackathon)"
